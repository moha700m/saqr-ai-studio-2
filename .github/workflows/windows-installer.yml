name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installer/requirements-windows.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements-windows.txt pytest
          python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"

      - name: Unit tests (engine)
        run: python -m pytest tests -q -m "not models"
        env:
          PYTHONPATH: engine;desktop

      - name: Generate assets
        run: |
          python scripts/make_icon.py
          python scripts/gen_inno_models.py

      - name: Version
        id: ver
        run: |
          $v = "0.1.0"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app (PyInstaller)
        run: pyinstaller installer/saqr.spec --noconfirm --clean

      - name: Smoke test frozen app
        run: |
          $exe = "dist/SAQR AI Studio/SAQR AI Studio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--probe-json", "$env:RUNNER_TEMP\probe.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\probe.txt"
          if ($p.ExitCode -ne 0) { Write-Host "::error::probe failed: $($p.ExitCode)"; exit 1 }
          (Get-ChildItem "dist/SAQR AI Studio" -Recurse | Measure-Object -Sum Length).Sum / 1MB

      - name: Bundle FFmpeg (GPL shared build, BtbN)
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ff" -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ff" -Recurse -Directory -Filter bin | Select-Object -First 1
          $dst = "dist/SAQR AI Studio/ffmpeg"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" $dst
          Copy-Item "$($bin.FullName)\*.dll" $dst
          $lic = Get-ChildItem "$env:RUNNER_TEMP\ff" -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dst\FFMPEG-LICENSE.txt" }
          "FFmpeg (GPL build by BtbN, https://github.com/BtbN/FFmpeg-Builds). Source: https://ffmpeg.org/download.html" | Out-File "$dst\README.txt" -Encoding ascii
          & "$dst\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Build installer (Inno Setup)
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /? 2>&1 | Select-Object -First 2
          $out = & $iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\saqr.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            ($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 8) | ForEach-Object { Write-Host "::error::ISCC: $_" }
            exit 1
          }
          Get-Item installer\Output\SAQR-AI-Setup.exe | Select-Object Name, Length

      - name: Silent install, diagnostics, real swap, uninstall
        timeout-minutes: 30
        run: |
          $setup = "installer\Output\SAQR-AI-Setup.exe"
          $log = "$env:RUNNER_TEMP\install.log"
          function Fail($msg) { Write-Host "::error::$msg"; throw $msg }
          function Stage($msg) { Write-Host "::notice::$((Get-Date).ToString('HH:mm:ss')) $msg" }
          function Run($file, [string[]]$argv, $seconds, $what) {
            $t = Get-Date
            $p = Start-Process -FilePath $file -ArgumentList $argv -PassThru
            if (-not $p.WaitForExit($seconds * 1000)) {
              Get-Process | Where-Object { $_.ProcessName -match 'SAQR|unins|setup' } | ForEach-Object { Write-Host "::error::still running: $($_.ProcessName) pid $($_.Id)" }
              if (Test-Path $log) { Get-Content $log -Tail 6 | ForEach-Object { Write-Host "::error::install.log: $_" } }
              $p | Stop-Process -Force -ErrorAction SilentlyContinue
              Fail "$what timed out after $seconds s"
            }
            Stage "$what finished in $([int]((Get-Date) - $t).TotalSeconds) s, exit code $($p.ExitCode)"
            return $p.ExitCode
          }
          $rc = Run $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/ACCEPTMODELLICENSES=1", "/LOG=`"$log`"") 1200 "silent install"
          if ($rc -ne 0) { Get-Content $log -Tail 8 | ForEach-Object { Write-Host "::error::install.log: $_" }; Fail "install failed $rc" }
          $app = "$env:LOCALAPPDATA\Programs\SAQR AI Studio"
          $data = "$env:LOCALAPPDATA\SAQR AI Studio"
          if (-not (Test-Path "$app\SAQR AI Studio.exe")) { Fail "app exe missing" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SAQR AI Studio.lnk")) { Fail "start menu shortcut missing" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\SAQR AI Studio.lnk")) { Fail "desktop shortcut missing" }
          $models = Get-ChildItem "$data\models" -Filter *.onnx
          $models | Select-Object Name, Length | Format-Table
          Stage "$($models.Count) model files installed"
          if (-not (Test-Path "$data\install_selftest.json")) { Fail "installer did not write the self-test report" }
          Get-Content "$data\install_selftest.txt" | ForEach-Object { Stage "selftest: $_" }
          $st = Get-Content "$data\install_selftest.json" | ConvertFrom-Json
          if (-not $st.backend.selected) { Fail "installer hardware/backend check did not select a backend" }
          $env:SAQR_WATCHDOG = "420"
          $rc = Run "$app\SAQR AI Studio.exe" @("--selftest-json", "`"$env:RUNNER_TEMP\selftest.json`"") 480 "model self-test"
          if (Test-Path "$env:RUNNER_TEMP\selftest.log") { Get-Content "$env:RUNNER_TEMP\selftest.log" | Select-Object -Last 40 | ForEach-Object { Write-Host "::notice::selftest.log: $_" } }
          if ($rc -ne 0) { Fail "model self-test failed ($rc)" }
          Copy-Item "$env:RUNNER_TEMP\selftest.json" installer\Output\ci-selftest.json
          $rc = Run "$app\SAQR AI Studio.exe" @("--cli", "swap", "-s", "tests\fixtures\painting_youth_met.jpg", "-t", "tests\fixtures\painting_lady_1760.jpg", "-o", "`"$env:RUNNER_TEMP\swap.png`"", "--i-have-consent") 300 "face swap"
          if (Test-Path "$data\cli_watchdog.log") { Get-Content "$data\cli_watchdog.log" | Select-Object -Last 30 | ForEach-Object { Write-Host "::notice::cli_watchdog.log: $_" } }
          if ($rc -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\swap.png")) { Fail "swap failed ($rc)" }
          Copy-Item "$env:RUNNER_TEMP\swap.png" installer\Output\ci-swap-result.png
          $null = Run "$app\unins000.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") 300 "uninstall"
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\SAQR AI Studio.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\SAQR AI Studio.exe") { Fail "uninstall left the app behind" }
          if (Test-Path "$env:USERPROFILE\Desktop\SAQR AI Studio.lnk") { Fail "uninstall left the shortcut" }
          Stage "install / diagnostics / swap / uninstall: OK"

      - name: Checksums
        run: |
          $h = (Get-FileHash installer\Output\SAQR-AI-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SAQR-AI-Setup.exe" | Out-File installer\Output\SHA256SUMS.txt -Encoding ascii
          Get-Content installer\Output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SAQR-AI-Setup
          path: |
            installer/Output/SAQR-AI-Setup.exe
            installer/Output/SHA256SUMS.txt
            installer/Output/ci-selftest.json
            installer/Output/ci-swap-result.png

      - name: Publish release
        # Runs after the install/swap/uninstall test passed. On main it creates/updates the release tag itself.
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SAQR AI Studio ${{ steps.ver.outputs.version }}
          make_latest: "true"
          overwrite_files: true
          files: |
            installer/Output/SAQR-AI-Setup.exe
            installer/Output/SHA256SUMS.txt
          body: |
            ## SAQR AI Studio ${{ steps.ver.outputs.version }}
            **Download `SAQR-AI-Setup.exe` and run it.** The installer detects your CPU/GPU, downloads the AI models
            (after you accept their licences, SHA-256 verified), creates shortcuts, tests your hardware and starts the app.

            * Windows 10/11 64-bit. GPU acceleration via DirectML (NVIDIA, AMD, Intel), automatic CPU fallback.
            * Unsigned build: Windows SmartScreen may warn — choose "More info → Run anyway".
            * Face models are licensed for non-commercial research use only (see MODEL_LICENSES.md).
